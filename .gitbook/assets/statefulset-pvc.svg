<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>

  <!-- StatefulSet -->
  <rect x="20" y="20" width="860" height="290" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="50" font-size="16" font-weight="700" fill="#0f172a">Testing module (StatefulSet)</text>
  <text x="860" y="50" font-size="13" fill="#64748b" text-anchor="end">Each pod has a fixed name and its own storage</text>

  <!-- Pods -->
  <g font-size="14" text-anchor="middle">
    <rect x="50" y="80" width="230" height="80" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="165" y="112" font-weight="700" fill="#312e81">akto-external-testing-0</text>
    <text x="165" y="136" font-size="12" fill="#4338ca">Testing pod 1</text>

    <rect x="335" y="80" width="230" height="80" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="450" y="112" font-weight="700" fill="#312e81">akto-external-testing-1</text>
    <text x="450" y="136" font-size="12" fill="#4338ca">Testing pod 2</text>

    <rect x="620" y="80" width="230" height="80" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="735" y="112" font-weight="700" fill="#312e81">akto-external-testing-2</text>
    <text x="735" y="136" font-size="12" fill="#4338ca">Testing pod 3</text>
  </g>

  <!-- Arrows -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <line x1="165" y1="160" x2="165" y2="205"/>
    <line x1="450" y1="160" x2="450" y2="205"/>
    <line x1="735" y1="160" x2="735" y2="205"/>
  </g>
  <g font-size="12" fill="#475569" text-anchor="start">
    <text x="175" y="188">/app/testing-info</text>
    <text x="460" y="188">/app/testing-info</text>
    <text x="745" y="188">/app/testing-info</text>
  </g>

  <!-- PVCs -->
  <g font-size="14" text-anchor="middle">
    <rect x="50" y="210" width="230" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="165" y="240" font-weight="700" fill="#14532d">Volume (PVC)</text>
    <text x="165" y="262" font-size="12" fill="#166534">testing-info-…-0</text>
    <text x="165" y="279" font-size="12" fill="#166534">stores its .json file</text>

    <rect x="335" y="210" width="230" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="450" y="240" font-weight="700" fill="#14532d">Volume (PVC)</text>
    <text x="450" y="262" font-size="12" fill="#166534">testing-info-…-1</text>
    <text x="450" y="279" font-size="12" fill="#166534">stores its .json file</text>

    <rect x="620" y="210" width="230" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="735" y="240" font-weight="700" fill="#14532d">Volume (PVC)</text>
    <text x="735" y="262" font-size="12" fill="#166534">testing-info-…-2</text>
    <text x="735" y="279" font-size="12" fill="#166534">stores its .json file</text>
  </g>

  <!-- Restart strip -->
  <rect x="20" y="335" width="860" height="115" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="40" y="365" font-size="16" font-weight="700" fill="#78350f">When a pod restarts</text>
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="385" width="200" height="45" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="140" y="404" font-weight="700" fill="#312e81">akto-external-testing-1</text>
    <text x="140" y="421" font-size="11" fill="#4338ca">stops or moves node</text>

    <rect x="330" y="385" width="200" height="45" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="430" y="404" font-weight="700" fill="#312e81">akto-external-testing-1</text>
    <text x="430" y="421" font-size="11" fill="#4338ca">comes back, same name</text>

    <rect x="640" y="385" width="220" height="45" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="750" y="404" font-weight="700" fill="#14532d">Same volume …-1</text>
    <text x="750" y="421" font-size="11" fill="#166534">reuses its saved file</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <line x1="240" y1="407" x2="325" y2="407"/>
    <line x1="530" y1="407" x2="635" y2="407"/>
  </g>
</svg>
