<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="570" fill="#ffffff"/>

  <!-- Kafka -->
  <rect x="20" y="15" width="860" height="60" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="450" y="42" font-size="16" font-weight="700" fill="#831843" text-anchor="middle">Kafka (runs separately, SASL enabled)</text>
  <text x="450" y="62" font-size="12" fill="#9d174d" text-anchor="middle">Holds the queue of test messages and remembers how far each run has progressed</text>

  <!-- StatefulSet -->
  <rect x="20" y="115" width="860" height="290" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="307" y="143" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Testing module (StatefulSet)</text>

  <!-- arrows pod <-> kafka -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)">
    <line x1="165" y1="75" x2="165" y2="175"/>
    <line x1="450" y1="75" x2="450" y2="175"/>
    <line x1="735" y1="75" x2="735" y2="175"/>
  </g>
  <g font-size="12" fill="#475569">
    <text x="175" y="104">SASL</text>
    <text x="460" y="104">SASL</text>
    <text x="745" y="104">SASL</text>
  </g>

  <!-- Pods -->
  <g font-size="14" text-anchor="middle">
    <rect x="50" y="175" width="230" height="80" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="165" y="207" font-weight="700" fill="#312e81">akto-external-testing-0</text>
    <text x="165" y="231" font-size="12" fill="#4338ca">Testing pod 1</text>

    <rect x="335" y="175" width="230" height="80" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="450" y="207" font-weight="700" fill="#312e81">akto-external-testing-1</text>
    <text x="450" y="231" font-size="12" fill="#4338ca">Testing pod 2</text>

    <rect x="620" y="175" width="230" height="80" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="735" y="207" font-weight="700" fill="#312e81">akto-external-testing-2</text>
    <text x="735" y="231" font-size="12" fill="#4338ca">Testing pod 3</text>
  </g>

  <!-- Arrows to volumes -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <line x1="165" y1="255" x2="165" y2="300"/>
    <line x1="450" y1="255" x2="450" y2="300"/>
    <line x1="735" y1="255" x2="735" y2="300"/>
  </g>
  <g font-size="12" fill="#475569">
    <text x="175" y="283">/app/testing-info</text>
    <text x="460" y="283">/app/testing-info</text>
    <text x="745" y="283">/app/testing-info</text>
  </g>

  <!-- PVCs -->
  <g font-size="14" text-anchor="middle">
    <rect x="50" y="305" width="230" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="165" y="335" font-weight="700" fill="#14532d">Volume (PVC)</text>
    <text x="165" y="357" font-size="12" fill="#166534">testing-info-…-0</text>
    <text x="165" y="374" font-size="12" fill="#166534">saves the run's state file</text>

    <rect x="335" y="305" width="230" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="450" y="335" font-weight="700" fill="#14532d">Volume (PVC)</text>
    <text x="450" y="357" font-size="12" fill="#166534">testing-info-…-1</text>
    <text x="450" y="374" font-size="12" fill="#166534">saves the run's state file</text>

    <rect x="620" y="305" width="230" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="735" y="335" font-weight="700" fill="#14532d">Volume (PVC)</text>
    <text x="735" y="357" font-size="12" fill="#166534">testing-info-…-2</text>
    <text x="735" y="374" font-size="12" fill="#166534">saves the run's state file</text>
  </g>

  <!-- Restart strip -->
  <rect x="20" y="430" width="860" height="125" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="40" y="460" font-size="16" font-weight="700" fill="#78350f">When a pod restarts</text>
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="480" width="200" height="50" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="140" y="500" font-weight="700" fill="#312e81">akto-external-testing-1</text>
    <text x="140" y="518" font-size="11" fill="#4338ca">stops or moves node</text>

    <rect x="330" y="480" width="200" height="50" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="430" y="500" font-weight="700" fill="#312e81">akto-external-testing-1</text>
    <text x="430" y="518" font-size="11" fill="#4338ca">comes back, same name</text>

    <rect x="620" y="480" width="240" height="50" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="740" y="500" font-weight="700" fill="#14532d">Same volume, same Kafka queue</text>
    <text x="740" y="518" font-size="11" fill="#166534">continues the run where it stopped</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <line x1="240" y1="505" x2="325" y2="505"/>
    <line x1="530" y1="505" x2="615" y2="505"/>
  </g>
</svg>
